<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · 禅心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/icons.css">
</head>
<body>

<div class="atmosphere"></div>

<div class="app-container">
  <div class="settings-top-bar">
    <a class="nav-back" href="profile.html" title="返回">←</a>
    <h1 class="settings-top-title">设置</h1>
    <div style="width:36px"></div>
  </div>

  <div class="page-content">
    <div class="settings-list">
      <!-- 每日提醒 -->
      <div class="settings-row" onclick="showToast('即将上线，敬请期待')">
        <div class="settings-row-left">
          <span class="settings-row-icon">🔔</span>
          <div class="settings-row-info">
            <span class="settings-row-title">每日提醒</span>
            <span class="settings-row-sub">设置冥想提醒时间</span>
          </div>
        </div>
        <span class="settings-row-arrow">›</span>
      </div>

      <!-- 冥想类型偏好 -->
      <a class="settings-row" href="type-prefs.html">
        <div class="settings-row-left">
          <span class="settings-row-icon">🧘</span>
          <div class="settings-row-info">
            <span class="settings-row-title">冥想类型偏好</span>
            <span class="settings-row-sub" id="type-prefs-sub">7/20 已启用</span>
          </div>
        </div>
        <span class="settings-row-arrow">›</span>
      </a>

      <!-- 关于我们 -->
      <div class="settings-row" onclick="openAbout()">
        <div class="settings-row-left">
          <span class="settings-row-icon">🙏</span>
          <div class="settings-row-info">
            <span class="settings-row-title">关于我们</span>
            <span class="settings-row-sub">版本信息与产品介绍</span>
          </div>
        </div>
        <span class="settings-row-arrow">›</span>
      </div>
    </div>
  </div>
</div>

<!-- 关于我们弹窗 -->
<div class="about-overlay" id="about-overlay" onclick="closeAbout(event)">
  <div class="about-sheet" onclick="event.stopPropagation()">
    <div class="about-sheet-handle"></div>
    <div class="about-logo">禅心</div>
    <div class="about-name">禅心 · 冥想日记</div>
    <div class="about-version">v1.0.0</div>
    <div class="about-desc">
      以佛教禅修传统为根基，融合现代极简设计美学，<br>
      帮助修行者建立持续、有觉知的冥想习惯。<br><br>
      纯前端应用，数据完全本地存储，<br>
      无需注册，无需联网，无任何数据上传。
    </div>
    <div class="about-divider"></div>
    <div class="about-footer">
      <span>诸行无常，是生灭法</span>
    </div>
    <button class="about-close-btn" onclick="closeAbout()">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/constants.js"></script>
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
