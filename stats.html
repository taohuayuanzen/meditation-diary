<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据统计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/icons.css">
</head>
<body>

<div class="atmosphere"></div>

<div class="app-container">
  <div class="settings-top-bar">
    <a class="nav-back" href="profile.html" title="返回">←</a>
    <h1 class="settings-top-title">数据统计</h1>
    <div style="width:36px"></div>
  </div>

  <div class="page-content">
    <!-- Period Tabs -->
    <div class="stats-tabs">
      <button class="stats-tab active" data-period="week" onclick="switchPeriod('week')">周</button>
      <button class="stats-tab" data-period="month" onclick="switchPeriod('month')">月</button>
      <button class="stats-tab" data-period="all" onclick="switchPeriod('all')">累计</button>
    </div>

    <!-- 7-Day Practice Indicator (week only) -->
    <!-- <div class="stats-week-dots" id="stats-week-dots"></div> -->

    <!-- Week Navigation (week only) -->
    <div class="stats-week-nav" id="stats-week-nav"></div>

    <!-- Month Navigation (month only) -->
    <div class="stats-month-nav" id="stats-month-nav"></div>

    <!-- Summary Cards -->
    <div class="stats-summary" id="stats-summary"></div>

    <!-- Personal Best (all-time only) -->
    <div class="stats-personal-best" id="stats-personal-best"></div>

    <!-- 时长统计 -->
    <div class="stats-type-section">
      <div class="section-header">
        <h2>时长</h2>
      </div>
      <div class="stats-type-list" id="stats-duration-list"></div>
    </div>

    <!-- 次数统计 -->
    <div class="stats-type-section">
      <div class="section-header">
        <h2>次数</h2>
      </div>
      <div class="stats-type-list" id="stats-count-list"></div>
    </div>

    <!-- 平均每次时长统计 -->
    <div class="stats-type-section">
      <div class="section-header">
        <h2>平均每次</h2>
      </div>
      <div class="stats-type-list" id="stats-avg-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/constants.js"></script>
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
