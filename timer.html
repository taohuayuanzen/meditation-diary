<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>计时</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/icons.css">
</head>
<body class="immersive-body">

<div class="atmosphere immersive-atmosphere"></div>

<div class="immersive-container">
  <button class="timer-cancel-btn" id="cancel-btn" onclick="cancelMeditation()" title="取消">✕</button>
  <button class="timer-mood-btn" id="mood-btn" onclick="openMoodSheet()" title="记录心情">😌</button>
  <div class="timer-screen">
    <div class="timer-type-label" id="timer-type-label">冥想</div>

    <div class="timer-ring-container">
      <div class="breath-circle"></div>
      <svg class="timer-ring-svg" viewBox="0 0 260 260">
        <circle class="timer-ring-bg" cx="130" cy="130" r="120"/>
        <circle class="timer-ring-progress" id="timer-progress" cx="130" cy="130" r="120"
          stroke-dasharray="754" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-display">
        <div class="timer-time" id="timer-time">10:00</div>
        <div class="timer-breath-hint" id="breath-hint">吸气...</div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="timer-ctrl-btn primary" id="pause-btn" onclick="togglePause()" title="暂停">❚❚</button>
    </div>

    <button class="timer-finish-btn" id="finish-btn" onclick="finishMeditation()">完成</button>
  </div>
</div>

<!-- Confirm Modal -->
<div class="confirm-overlay" id="confirm-modal">
  <div class="confirm-box">
    <h3>确认取消？</h3>
    <p>当前冥想将不会被记录</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="closeConfirm()">继续冥想</button>
      <button class="confirm-ok" onclick="confirmCancel()">确认取消</button>
    </div>
  </div>
</div>

<!-- Mood Sheet (Two-step) -->
<div class="setup-sheet-overlay" id="mood-sheet-overlay" onclick="closeMoodSheet()">
  <div class="setup-sheet" onclick="event.stopPropagation()">
    <div class="setup-sheet-handle"></div>

    <!-- Sheet Header -->
    <div class="mood-sheet-header">
      <button class="mood-sheet-back hidden" id="mood-back-btn" onclick="moodSheetBack()">←</button>
      <div class="mood-sheet-title-center" id="mood-sheet-title">记录此刻心情</div>
      <button class="mood-sheet-close" onclick="closeMoodSheet()">✕</button>
    </div>

    <!-- Step 1: Category Selection -->
    <div id="mood-step1">
      <div class="mood-cat-row" id="mood-cat-row"></div>
    </div>

    <!-- Step 2: Feeling Selection -->
    <div class="mood-feelings-wrap" id="mood-step2">
      <div class="mood-feelings-label" id="mood-feelings-label">选择你的感受</div>
      <div class="mood-feelings-grid" id="mood-feelings-grid"></div>
      <button class="mood-feelings-confirm" id="mood-confirm-btn" onclick="confirmMoodSelection()" disabled>确认</button>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/store.js"></script>
<script src="js/session.js"></script>
<script src="js/audio.js"></script>
<script src="js/utils.js"></script>
<script src="js/timer.js"></script>
</body>
</html>
