<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时长偏好</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/icons.css">
</head>
<body>

<div class="atmosphere"></div>

<div class="app-container">
  <div class="settings-top-bar">
    <a class="nav-back" href="settings.html" title="返回">←</a>
    <h1 class="settings-top-title">时长偏好</h1>
    <div style="width:36px"></div>
  </div>

  <div class="page-content">
    <div class="settings-header">
      <h1>选择你的冥想时长</h1>
      <p>选择 3~5 项展示在冥想设置页</p>
    </div>

    <div class="settings-section">
      <div class="settings-section-header">
        <h2>已启用时长</h2>
        <span class="settings-count" id="dur-count">5/10</span>
      </div>
      <div class="dur-toggle-grid" id="dur-toggle-grid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/constants.js"></script>
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
