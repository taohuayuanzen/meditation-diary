<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/icons.css">
</head>
<body class="immersive-body">

<div class="atmosphere immersive-atmosphere"></div>

<div class="immersive-container">
  <div class="reflection-header">
    <h1>冥想结束</h1>
    <p id="reflection-duration">本次冥想 10 分钟</p>
  </div>

  <div class="setup-section">
    <div class="setup-label">此刻心情</div>
    <div class="mood-trigger" id="mood-after-trigger" onclick="openReflectionMoodSheet()">
      <span class="mood-trigger-icon" id="mood-trigger-icon">😌</span>
      <span class="mood-trigger-text" id="mood-trigger-text">点击选择心情</span>
    </div>
  </div>

  <div class="reflection-section">
    <div class="setup-label">冥想感悟</div>
    <textarea class="insight-textarea" id="insight-text" placeholder="写下此刻的感受、觉察或领悟..."></textarea>
  </div>

  <div class="reflection-actions">
    <button class="save-btn" onclick="saveEntry()">保存记录</button>
    <button class="discard-btn" onclick="goBackToMeditate()">放弃记录</button>
  </div>
</div>

<!-- Mood Sheet (Two-step) -->
<div class="setup-sheet-overlay" id="mood-ref-sheet-overlay" onclick="closeReflectionMoodSheet()">
  <div class="setup-sheet" onclick="event.stopPropagation()">
    <div class="setup-sheet-handle"></div>

    <div class="mood-sheet-header">
      <button class="mood-sheet-back hidden" id="mood-ref-back-btn" onclick="moodRefSheetBack()">←</button>
      <div class="mood-sheet-title-center" id="mood-ref-title">此刻心情</div>
      <button class="mood-sheet-close" onclick="closeReflectionMoodSheet()">✕</button>
    </div>

    <div id="mood-ref-step1">
      <div class="mood-cat-row" id="mood-ref-cat-row"></div>
    </div>

    <div class="mood-feelings-wrap" id="mood-ref-step2">
      <div class="mood-feelings-label">选择你的感受（可多选）</div>
      <div class="mood-feelings-grid" id="mood-ref-feelings-grid"></div>
      <button class="mood-feelings-confirm" id="mood-ref-confirm-btn" onclick="confirmRefMoodSelection()" disabled>确认</button>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/store.js"></script>
<script src="js/session.js"></script>
<script src="js/audio.js"></script>
<script src="js/utils.js"></script>
<script src="js/reflection.js"></script>
</body>
</html>
